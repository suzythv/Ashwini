<!DOCTYPE html>
<html>
<head>
  <title>Birthday Surprise 🎂</title>
  <style>
    body {
      margin: 0;
      background: black;
      color: white;
      text-align: center;
      font-family: Arial;
    }

    h1 {
      margin-top: 20%;
      font-size: 40px;
    }

    button {
      padding: 12px 25px;
      font-size: 20px;
      background: pink;
      border: none;
      cursor: pointer;
    }

    .cat {
      position: absolute;
      width: 100px;
      animation: move 5s linear infinite;
    }

    @keyframes move {
      from { left: -100px; }
      to { left: 100%; }
    }
  </style>
</head>

<body>

<h1 id="text">Click the gift 🎁</h1>

<button onclick="showWish()">Open 🎁</button>

<div id="cats"></div>

<script>
function showWish() {
  document.getElementById("text").innerHTML = "🐱 Happy Birthday!!! 🎂💖";

  let cats = document.getElementById("cats");

  for (let i = 0; i < 6; i++) {
    let img = document.createElement("img");
    img.src = "https://media.giphy.com/media/JIX9t2j0ZTN9S/giphy.gif";
    img.className = "cat";
    img.style.top = (Math.random() * 400) + "px";
    cats.appendChild(img);
  }
}
</script>

</body>
</html>
